<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DeepSeek 四驱小车</title>
<style>
:root{color-scheme:dark;--bg:#102021;--panel:#183033;--line:#426065;--fg:#effafa;--muted:#b6cbcd;--mint:#80e0c3;--warn:#ffd19f;--red:#ffc3cb}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,sans-serif}
main{max-width:1100px;margin:auto;padding:24px 16px 46px} h1{font-size:clamp(25px,5vw,34px);line-height:1.2;margin:0 0 6px}
h2{font-size:18px;margin:0 0 10px} p{color:var(--muted);margin:5px 0 9px} section,details{min-width:0;padding:15px;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-top:12px}
summary{cursor:pointer;min-height:44px;padding:6px 0;font-weight:700} .columns,.row,.fields{display:grid;gap:9px}
.columns{grid-template-columns:repeat(auto-fit,minmax(min(100%,350px),1fr))} .row,.fields{grid-template-columns:repeat(auto-fit,minmax(min(100%,145px),1fr))}
button,input,select,textarea{font:inherit;min-height:44px;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--fg);width:100%}
button{cursor:pointer;font-weight:650} button:disabled{opacity:.5;cursor:default}
.primary{background:var(--mint);border-color:var(--mint);color:#112b28}.danger{background:#773341;color:var(--red);border-color:#ac5360}
:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
label{display:grid;gap:4px;color:var(--muted);font-size:14px}
label.check{display:flex;align-items:center;gap:7px;min-height:44px}
input[type=checkbox]{width:20px;min-height:20px;accent-color:var(--mint)}
dl{display:grid;grid-template-columns:minmax(92px,1fr) 2fr;gap:6px;margin:0 0 12px}
dt{color:var(--muted)} dd{margin:0;font-weight:600;overflow-wrap:anywhere}
#notice{min-height:28px;margin:9px 0;color:var(--mint)} #notice.error{color:var(--red)}
#map{display:block;width:min(100%,420px);height:auto;margin:0 auto;border:1px solid var(--line);border-radius:6px;cursor:crosshair}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:14px;color:var(--muted);margin:8px 0}
.marker{display:inline-block;width:10px;height:10px;margin-right:4px;border-radius:2px}
#memory_log{white-space:pre-wrap;margin-top:10px;color:var(--muted);overflow-wrap:anywhere}
.small{font-size:14px}[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>DeepSeek 四驱小车</h1>
<p>双麦语音 · 超声波建图 · ESP32-S3 直连</p>
<section id="unlock">
  <h2>控制台口令</h2>
  <form id="login" class="fields">
    <label>USB 串口显示的口令<input id="key" type="password" autocomplete="current-password" required></label>
    <button class="primary">解锁</button>
  </form>
</section>
<div id="notice" role="status" aria-live="polite"></div>
<div id="panel" hidden>
  <div class="columns">
    <section>
      <h2>状态与语音</h2>
      <dl>
        <dt>局域网</dt><dd id="ip">—</dd>
        <dt>云端</dt><dd id="cloud">—</dd>
        <dt>前向测距</dt><dd id="sonar">—</dd>
        <dt>四轮驱动</dt><dd id="motion">—</dd>
        <dt>双麦与方向</dt><dd id="mic">—</dd>
        <dt>唤醒与回声</dt><dd id="wake">—</dd>
        <dt>转写</dt><dd id="transcript">—</dd>
        <dt>回复</dt><dd id="reply">—</dd>
      </dl>
      <div class="row">
        <button data-command="arm" class="primary">启用电机</button>
        <button data-command="emergency" class="danger">急停并锁定</button>
        <button data-command="listen">手动听一句</button>
        <button data-command="tone">喇叭测试音</button>
      </div>
    </section>
    <section>
      <h2>超声波地图</h2>
      <canvas id="map" width="420" height="420" aria-label="超声波地图。也可用下面的目标列、行输入选择终点。"></canvas>
      <div class="legend"><span><i class="marker" style="background:#5f8e80"></i>可通行</span><span><i class="marker" style="background:#c57d7e"></i>障碍</span><span><i class="marker" style="background:#1c373b"></i>未知</span><span><i class="marker" style="background:#ffe3a3"></i>估计车位</span></div>
      <p id="nav_state">—</p>
      <div class="row">
        <label>目标列（0–20）<input id="gx" type="number" min="0" max="20" value="10"></label>
        <label>目标行（0–20）<input id="gy" type="number" min="0" max="20" value="10"></label>
        <button id="route">导航到所选格</button>
      </div>
      <div class="row">
        <button data-command="explore">开始扫描建图</button>
        <button data-command="home">返回起点</button>
        <button data-command="stop">停止</button>
        <button data-command="save_map">保存地图</button>
      </div>
      <div class="row">
        <label>当前位置名称<input id="point_name" maxlength="12" placeholder="例如 客厅"></label>
        <button id="mark">保存为地点</button>
      </div>
      <div id="places" class="row"></div>
    </section>
  </div>
  <details>
    <summary>底盘校准与单轮测试</summary>
    <p>架空轮组，先验证每个电机的方向。做格距和转角校准时再把车放到平整地面。</p>
    <div class="row">
      <button data-wheel="0" data-command="move_forward">左前</button>
      <button data-wheel="1" data-command="move_forward">右前</button>
      <button data-wheel="2" data-command="move_forward">左后</button>
      <button data-wheel="3" data-command="move_forward">右后</button>
      <button data-command="move_forward">前进</button>
      <button data-command="move_backward">短后退</button>
      <button data-command="turn_left">左转</button>
      <button data-command="turn_right">右转</button>
      <button data-cal="move_forward" data-command="calibrate">标定走一格</button>
      <button data-cal="turn_left" data-command="calibrate">标定左转 90°</button>
      <button data-cal="turn_right" data-command="calibrate">标定右转 90°</button>
    </div>
    <p>把小车放在标记好的原点，并使车头与地图的起始朝向一致。</p>
    <div class="row">
      <label>起点朝向<select id="origin_heading"><option value="0">上</option><option value="1">右</option><option value="2">下</option><option value="3">左</option></select></label>
      <button data-command="origin">重新对齐起点</button>
      <button data-command="new_map">清空并设起点</button>
    </div>
  </details>
  <details id="settings">
    <summary>Wi-Fi、DeepSeek 与参数</summary>
    <form id="config">
      <div class="fields">
        <label>2.4 GHz Wi-Fi 名称<input name="ssid" maxlength="32" autocomplete="off"></label>
        <label>Wi-Fi 密码<input name="password" type="password" maxlength="64" autocomplete="new-password"></label>
        <label>DeepSeek API 密钥<input name="api_key" type="password" maxlength="160" autocomplete="new-password"></label>
        <label>本地唤醒词<select name="wake_choice"></select></label>
        <label>TTS 音色<select name="voice"><option value="stella">海星 · 女声</option><option value="tide">暗潮 · 男声</option></select></label>
      </div>
      <label>对话资料和偏好<textarea name="profile" maxlength="100" rows="2" placeholder="例如 请用简短的中文回答"></textarea></label>
      <div class="row">
        <label class="check"><input type="checkbox" name="clear_password">清除 Wi-Fi 密码</label>
        <label class="check"><input type="checkbox" name="clear_key">清除 API 密钥</label>
        <label class="check"><input type="checkbox" name="history">保存近期对话</label>
        <label class="check"><input type="checkbox" name="barge">播报时允许插话</label>
      </div>
      <details>
        <summary>测距、电机和声音</summary>
        <div class="fields">
          <label>前向急停（cm）<input name="stop_cm" type="number" min="15" max="100" required></label>
          <label>最大 PWM<input name="speed" type="number" min="80" max="180" required></label>
          <label>巡游 PWM<input name="nav_speed" type="number" min="65" max="180" required></label>
          <label>前进一格（ms）<input name="step_ms" type="number" min="130" max="1800" required></label>
          <label>左转 90°（ms）<input name="turn_left_ms" type="number" min="120" max="1700" required></label>
          <label>右转 90°（ms）<input name="turn_right_ms" type="number" min="120" max="1700" required></label>
          <label>格边长（cm）<input name="cell_cm" type="number" min="20" max="45" required></label>
          <label>麦克风间距（mm）<input name="mic_spacing_mm" type="number" min="40" max="220" required></label>
          <label>收音门限（RMS）<input name="vad_rms" type="number" min="50" max="3500" required></label>
          <label>打断门限（RMS）<input name="barge_rms" type="number" min="80" max="4500" required></label>
          <label>播报音量（%）<input name="volume" type="number" min="0" max="75" required></label>
          <label>回声参考延迟帧<input name="ref_delay" type="number" min="0" max="3" required></label>
        </div>
        <div class="fields" id="polarity"></div>
      </details>
      <p class="small">保存后重启并锁定电机。只有重新确认过的起点才能用于寻路。</p>
      <button class="primary">保存并重启</button>
    </form>
  </details>
  <details>
    <summary>对话记忆</summary>
    <div class="row">
      <button id="read_memory">读取已保存记忆</button>
      <button id="clear_memory">清空历史</button>
      <button id="clear_all">清空历史和语音偏好</button>
    </div>
    <div id="memory_log"></div>
  </details>
</div>
</main>
<script>
const byId = id => document.getElementById(id);
const form = byId('config');
const field = name => form.elements.namedItem(name);
const canvas = byId('map'), pen = canvas.getContext('2d');
const numeric = ['stop_cm','speed','nav_speed','step_ms','turn_left_ms','turn_right_ms','cell_cm','vad_rms','barge_rms','mic_spacing_mm','volume','ref_delay'];
let key = '', online = false, pending = false, currentMap = null, selected = {x:10,y:10}, placesCache = '';
try { key = sessionStorage.getItem('rover-key') || ''; } catch {}
const headings = ['上','右','下','左'];
const navLabels = {origin_required:'待校准起点',origin_set:'起点已对齐',stopped:'已停车',exploring:'正在探索',planning:'正在规划',
  orienting:'正在转向',measuring:'正在测距',moving:'正在行驶',replanning:'障碍变化，重新规划',no_route:'暂无可通行路线',
  exploration_done:'可到达区域扫描结束',arrived:'已到达估计目标格',step_limit:'达到本轮步数上限',
  locked:'电机已锁定',motion_timeout:'动作超时',motion_aborted:'动作中断',turn_blocked:'转向被拦截',
  motion_refused:'前进被拦截',navigation_timeout:'达到本轮时限'};
const cloudLabels = {idle:'就绪',listening:'本地录音',asr:'DeepSeek 识别',flash:'Flash 生成',tts:'DeepSeek 合成',speaking:'播报中',
  interrupted:'已打断',audio_abort:'录音已取消',asr_error:'识别失败',flash_error:'Flash 失败',tts_error:'合成失败'};
const colors = {'.':'#5f8e80','#':'#c57d7e','?':'#1c373b'};
function notice(message, error = false) {
  byId('notice').textContent = message;
  byId('notice').classList.toggle('error', error);
}
function show(id, value) { byId(id).textContent = value; }
async function request(path, body) {
  const timeout = new AbortController();
  const timer = setTimeout(() => timeout.abort(), 5000);
  try {
    const result = await fetch(path, {method:body ? 'POST' : 'GET', signal:timeout.signal,
      headers:{'X-Console-Key':key,...(body ? {'Content-Type':'application/json'} : {})},
      body:body ? JSON.stringify(body) : undefined, cache:'no-store'});
    if (result.status === 401) throw new Error('控制台口令不正确。');
    if (!result.ok) throw new Error(path === '/api/config' ? '保存失败，请检查各项参数。' : '请求被拒绝，请检查底盘状态。');
    return path.startsWith('/api/control') || body ? undefined : await result.json();
  } finally { clearTimeout(timer); }
}
for (const [i,wheel] of ['左前','右前','左后','右后'].entries()) {
  const label = document.createElement('label');
  label.textContent = wheel + '方向';
  const select = document.createElement('select');
  select.name = 'polarity' + i;
  select.add(new Option('正向','1'));
  select.add(new Option('反向','-1'));
  label.append(select);
  byId('polarity').append(label);
}
function draw() {
  if (!currentMap) return;
  const size = canvas.width / currentMap.cells.length;
  for (let y = 0; y < currentMap.cells.length; y++) {
    for (let x = 0; x < currentMap.cells[y].length; x++) {
      pen.fillStyle = colors[currentMap.cells[y][x]];
      pen.fillRect(x*size, y*size, size-1, size-1);
    }
  }
  pen.strokeStyle = '#91edda';
  pen.lineWidth = 2;
  pen.strokeRect(selected.x*size+1, selected.y*size+1, size-2, size-2);
  if (currentMap.pose) {
    pen.save();
    pen.translate((currentMap.x+.5)*size, (currentMap.y+.5)*size);
    pen.rotate(currentMap.heading*Math.PI/2);
    pen.beginPath();
    pen.moveTo(0,-size*.4); pen.lineTo(size*.34,size*.32); pen.lineTo(-size*.34,size*.32); pen.closePath();
    pen.fillStyle = '#ffe3a3';
    pen.fill();
    pen.restore();
  }
}
function render(s) {
  show('ip', s.wifi ? s.ip : '配置热点');
  const cloud = s.cloud;
  if (!s.key_set) show('cloud', '待填写 API 密钥');
  else if (!s.wifi) show('cloud', '待连接 Wi-Fi');
  else if (!s.clock) show('cloud', '正在同步时钟');
  else show('cloud', (cloudLabels[cloud.phase] || cloud.phase) + (cloud.http >= 400 ? ' · HTTP ' + cloud.http : ''));
  show('sonar', s.valid ? s.cm + ' cm' + (s.blocked ? ' · 已拦截' : '') : '无有效回波');
  show('motion', s.armed ? (s.moving ? '运行中 · '+s.action : '已启用') : '已锁定');
  show('mic', s.left_rms + ' / ' + s.right_rms + ' RMS · ' + ({left:'左',right:'右',center:'中'}[s.doa] || '待定'));
  show('wake', (s.wake_ready ? s.wake_word : '唤醒模型未加载') + (s.aec ? ' · AEC' : '') +
    (s.listening ? ' · 收音中' : s.speaking ? ' · 播报中' : ''));
  show('transcript', cloud.transcript || '—');
  show('reply', cloud.reply || '—');
  currentMap = s.nav;
  show('nav_state', (navLabels[s.nav.message] || s.nav.message) + ' · 每格 ' + s.nav.cell_cm + ' cm' +
    (s.nav.pose ? ' · 车头朝' + headings[s.nav.heading] : ''));
  const places = JSON.stringify(s.nav.points);
  if (placesCache !== places) {
    placesCache = places;
    const buttons = s.nav.points.map(point => {
      const button = document.createElement('button');
      button.dataset.command = 'goto_name';
      button.dataset.place = point.name;
      button.textContent = '去' + point.name;
      return button;
    });
    byId('places').replaceChildren(...buttons);
  }
  document.querySelectorAll('[data-command=arm]').forEach(b => b.disabled = s.armed || !s.valid || s.blocked);
  document.querySelectorAll('[data-command=listen]').forEach(b => b.disabled = !cloud.ready || s.listening);
  document.querySelectorAll('[data-command=explore],[data-command=home],[data-command=goto_name],#route')
    .forEach(b => b.disabled = !s.armed || !s.nav.pose || s.nav.mode !== 'idle');
  byId('mark').disabled = !s.nav.pose || s.nav.mode !== 'idle' || s.moving;
  draw();
}
async function refresh() {
  if (!online || pending || document.hidden) return;
  pending = true;
  try { render(await request('/api/status')); }
  catch { notice('控制台暂时无法读取状态。', true); }
  finally { pending = false; }
}
async function unlock() {
  try {
    const cfg = await request('/api/config');
    for (const k of [...numeric,'ssid','voice','profile']) field(k).value = cfg[k];
    for (const k of ['history','barge']) field(k).checked = cfg[k];
    field('wake_choice').replaceChildren(...cfg.wake_options.map((phrase,i) => new Option(phrase,i)));
    field('wake_choice').value = cfg.wake_choice;
    cfg.polarity.forEach((p,i) => field('polarity'+i).value = p);
    field('password').placeholder = cfg.has_password ? '已保存，留空保留' : '';
    field('api_key').placeholder = cfg.has_api_key ? '已保存，留空保留' : 'sk-…';
    try { sessionStorage.setItem('rover-key', key); } catch {}
    byId('unlock').hidden = true;
    byId('panel').hidden = false;
    byId('settings').open = !cfg.has_api_key || !cfg.ssid;
    online = true;
    notice('');
    refresh();
  } catch (error) { notice(error.message, true); }
}
byId('login').addEventListener('submit', e => { e.preventDefault(); key = byId('key').value.trim(); unlock(); });
setInterval(refresh, 650);
document.addEventListener('visibilitychange', refresh);
async function control(data, message = '已发送。') {
  try { await request('/api/control', data); notice(message); }
  catch (error) { notice(error.message, true); }
  refresh();
}
byId('panel').addEventListener('click', e => {
  const button = e.target.closest('[data-command]');
  if (!button) return;
  const cmd = button.dataset.command;
  if (cmd === 'new_map' && !confirm('清空当前地图并将这里设为起点？保存地图后会覆写旧地图。')) return;
  const body = {cmd:cmd === 'new_map' ? 'origin' : cmd};
  if (cmd === 'new_map' || cmd === 'origin') {
    body.heading = Number(byId('origin_heading').value);
    body.clear = cmd === 'new_map';
  }
  if (cmd === 'home') { body.cmd = 'goto_name'; body.name = '起点'; }
  if (button.dataset.place) body.name = button.dataset.place;
  if (button.dataset.wheel) body.wheel = Number(button.dataset.wheel);
  if (button.dataset.cal) body.action = button.dataset.cal;
  control(body, button.textContent + ' · 请求已接受');
});
function select(x,y) {
  selected = {x,y};
  byId('gx').value = x;
  byId('gy').value = y;
  draw();
}
canvas.addEventListener('click', e => {
  if (!currentMap) return;
  const bounds = canvas.getBoundingClientRect();
  const count = currentMap.cells.length;
  select(Math.min(count-1,Math.max(0,Math.floor((e.clientX-bounds.left)/bounds.width*count))),
         Math.min(count-1,Math.max(0,Math.floor((e.clientY-bounds.top)/bounds.height*count))));
});
byId('route').addEventListener('click', () => {
  const x = Number(byId('gx').value), y = Number(byId('gy').value);
  if (!Number.isInteger(x) || !Number.isInteger(y) || !currentMap?.cells[y] || currentMap.cells[y][x] !== '.') {
    notice('请选择地图上标为可通行的格子。', true);
    return;
  }
  select(x,y);
  control({cmd:'goto',x,y});
});
byId('mark').addEventListener('click', () => {
  const name = byId('point_name').value.trim();
  if (name) control({cmd:'mark',name}, '已保存地点。');
});
async function memory() {
  try {
    const m = await request('/api/memory');
    show('memory_log', (m.note ? '语音保存的偏好  '+m.note+'\n\n' : '') +
      (m.turns.map(t => '你  '+t.user+'\n小车  '+t.reply).join('\n\n') || '暂无已保存对话。'));
  } catch (error) { notice(error.message, true); }
}
byId('read_memory').addEventListener('click', memory);
for (const id of ['clear_memory','clear_all']) byId(id).addEventListener('click', async () => {
  if (confirm(id === 'clear_all' ? '清空全部对话和语音保存的偏好？' : '清空已保存的对话？')) {
    await control({cmd:'clear_memory',include_note:id === 'clear_all'}, '记忆已清空。');
    memory();
  }
});
form.addEventListener('submit', async e => {
  e.preventDefault();
  const payload = {ssid:field('ssid').value, voice:field('voice').value, wake_choice:Number(field('wake_choice').value),
    profile:field('profile').value,
    history:field('history').checked, barge:field('barge').checked,
    polarity:[0,1,2,3].map(i => Number(field('polarity'+i).value))};
  for (const k of numeric) payload[k] = Number(field(k).value);
  if (field('clear_password').checked) payload.password = '';
  else if (field('password').value) payload.password = field('password').value;
  if (field('clear_key').checked) payload.api_key = '';
  else if (field('api_key').value.trim()) payload.api_key = field('api_key').value.trim();
  try {
    await request('/api/config', payload);
    online = false;
    byId('panel').hidden = true;
    byId('unlock').hidden = false;
    field('api_key').value = '';
    notice('已保存，等待重启。请按串口提示重新打开局域网地址。');
  } catch (error) { notice(error.message, true); }
});
if (key) unlock();
</script>
</body>
</html>
